<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <title>離線 · 題庫刷題</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        color: #0f172a;
        background: #eef2f7;
        font-family: "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      }
      main {
        max-width: 22rem;
        padding: 1.5rem;
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: 1.35rem;
      }
      p {
        margin: 0.75rem 0 1.25rem;
        line-height: 1.6;
        color: #475569;
        font-size: 0.95rem;
      }
      a,
      button {
        display: inline-block;
        margin: 0.25rem;
        border: 0;
        border-radius: 0.8rem;
        padding: 0.7rem 1rem;
        font: inherit;
        text-decoration: none;
        cursor: pointer;
      }
      button {
        color: #fff;
        background: #0f172a;
      }
      a {
        color: #0f172a;
        background: #fff;
        border: 1px solid #e2e8f0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>目前離線</h1>
      <p>已看過的題幹可離線作答，批改需連線。進度仍在這個瀏覽器裡。</p>
      <button type="button" onclick="location.reload()">再試一次</button>
      <a href="/">回首頁</a>
    </main>
  </body>
</html>
